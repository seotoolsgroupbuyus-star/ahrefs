settings:
  content:
    merge: true
media:
  - name: uploads
    label: Images
    input: public/images
    output: /images
    categories: [image]
content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    format: json
    filename: "{slug}.json"
    view: { primary: title, fields: [title, slug, status] }
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true }
      - { name: status, type: select, options: { values: [published, draft] } }
      - { name: isPillar, type: boolean }
      - { name: cluster, type: string }
      - { name: parentSlug, type: string }
      - { name: authorName, type: string }
      - { name: datePublished, type: string }
      - { name: dateModified, type: string }
      - { name: seoTitle, type: string }
      - { name: seoDescription, type: text }
      - name: sections
        label: Article sections
        type: object
        list:
          collapsible: { collapsed: true, summary: "{heading}" }
        fields:
          - { name: heading, type: string }
          - { name: html, type: rich-text, options: { format: html, media: uploads, switcher: false } }
  - name: site
    label: Homepage, Plans, Navigation, FAQ and Reviews
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: brand, type: string }
      - name: uiLabels
        label: Shared interface labels
        type: object
        fields:
          - { name: heroChips, type: string, list: true }
          - { name: trustStrip, type: string, list: true }
          - { name: toolStripHeading, type: string }
          - { name: billingLabel, type: string }
          - { name: monthlyLabel, type: string }
          - { name: yearlyLabel, type: string }
          - { name: currencyLabel, type: string }
          - { name: usdLabel, type: string }
          - { name: pkrLabel, type: string }
          - { name: popularRibbon, type: string }
          - { name: includedToolsLabel, type: string }
          - { name: planButton, type: string }
          - { name: copyCouponLabel, type: string }
          - { name: copiedCouponLabel, type: string }
          - { name: comparisonCaption, type: string }
          - { name: comparisonGroupBuyHeader, type: string }
          - { name: comparisonDirectHeader, type: string }
          - { name: articleCategorySuffix, type: string }
          - { name: tableOfContentsTitle, type: string }
          - { name: articleAsideTitle, type: string }
          - { name: articleAsideDescription, type: text }
          - { name: articleAsideButton, type: string }
          - { name: relatedReadingTitle, type: string }
          - { name: headerButton, type: string }
          - { name: footerSupportLabel, type: string }
          - { name: viewAllTools, type: string }
          - { name: allToolsTitle, type: string }
          - { name: allToolsDescription, type: text }
          - { name: closeModal, type: string }
          - { name: comparisonFeatureHeader, type: string }
          - { name: whatsappSupport, type: string }
          - { name: mobileMenu, type: string }
          - { name: publishedLabel, type: string }
          - { name: updatedLabel, type: string }
          - { name: bylineLabel, type: string }
          - { name: openDetailedComparison, type: string }
          - { name: detailedComparisonTitle, type: string }
          - { name: detailedComparisonFeatures, type: string, list: true }
          - { name: detailedComparisonClose, type: string }
          - { name: riskBadge, type: string }
          - { name: riskTitle, type: string }
          - { name: riskDescription, type: text }
          - { name: yearlyWhyTitle, type: string }
          - { name: yearlyWhyDescription, type: text }
          - { name: yearlyWhyLink, type: string }
          - { name: toolbarButton, type: string }
          - { name: toolbarSocialProof, type: string }
          - { name: toolbarMockUrl, type: string }
          - { name: toolbarMockMetrics, type: string, list: true }
          - { name: chatTitle, type: string }
          - { name: chatSubtitle, type: string }
          - { name: chatDescription, type: text }
          - { name: chatPlaceholder, type: string }
          - { name: chatOpenButton, type: string }
          - { name: chatNeedHelp, type: string }
          - { name: chatButtonLabel, type: string }
          - { name: chatCloseLabel, type: string }
          - { name: chatOpenLabel, type: string }
          - { name: chatDefaultMessage, type: text }
          - { name: footerPagesTitle, type: string }
          - { name: footerSupportTitle, type: string }
          - { name: footerSupportDescription, type: text }
          - { name: footerCopyrightSuffix, type: string }
          - { name: logoTop, type: string }
          - { name: logoBottom, type: string }
          - { name: authorEditorialLabel, type: string }
          - { name: authorWrittenBy, type: string }
          - { name: toolsSearchPlaceholder, type: string }
          - { name: seePricing, type: string }
          - { name: heroTitleAccent, type: string }
      - { name: siteUrl, type: string }
      - { name: googleSiteVerification, type: string }
      - { name: themeColor, type: string }
      - { name: ogImage, type: image, options: { media: uploads } }
      - { name: paymentBaseUrl, type: string }
      - { name: seoKeywords, type: string, list: true }
      - name: contentAuthors
        label: Article authors
        type: object
        list: true
        fields:
          - { name: name, type: string }
          - { name: jobTitle, type: string }
          - { name: bio, type: text }
          - { name: url, type: string }
      - { name: homeTitle, type: string }
      - { name: homeDescription, type: text }
      - { name: heroBadge, type: string }
      - { name: heroTitle, type: string }
      - { name: heroDescription, type: text }
      - { name: heroTrust, type: string }
      - { name: primaryCtaText, type: string }
      - { name: primaryCtaUrl, type: string }
      - { name: secondaryCtaText, type: string }
      - { name: secondaryCtaUrl, type: string }
      - { name: whatsappUrl, type: string }
      - { name: footerText, type: text }
      - { name: pkrRate, type: number }
      - { name: couponCode, type: string }
      - name: menu
        type: object
        list: true
        fields:
          - { name: label, type: string }
          - { name: url, type: string }
      - name: footerMenu
        type: object
        list: true
        fields:
          - { name: label, type: string }
          - { name: url, type: string }
      - { name: toolStrip, type: string, list: true }
      - { name: heroAvatars, type: image, list: true, options: { media: uploads } }
      - name: plans
        type: object
        list:
          collapsible: { collapsed: true, summary: "{name}" }
        fields:
          - { name: id, type: string }
          - { name: name, type: string }
          - { name: description, type: text }
          - { name: monthlyUsd, type: number }
          - { name: yearlyUsdPerMonth, type: number }
          - { name: popular, type: boolean }
          - { name: buyUrl, type: string }
          - { name: features, type: string, list: true }
          - { name: tools, type: string, list: true }
      - name: faq
        type: object
        list:
          collapsible: { collapsed: true, summary: "{question}" }
        fields:
          - { name: question, type: string }
          - { name: answer, type: text }
      - name: reviews
        type: object
        list:
          collapsible: { collapsed: true, summary: "{name}" }
        fields:
          - { name: name, type: string }
          - { name: role, type: string }
          - { name: content, type: text }
          - { name: date, type: string }
          - { name: avatar, type: image, options: { media: uploads } }
      - name: comparison
        type: object
        list: true
        fields:
          - { name: feature, type: string }
          - { name: groupBuy, type: text }
          - { name: direct, type: text }
      - name: limitations
        type: object
        list: true
        fields:
          - { name: title, type: string }
          - { name: desc, type: text }
          - { name: limitLabel, type: string }
      - name: tools
        type: object
        list: true
        fields:
          - { name: name, type: string }
          - { name: color, type: string }
          - { name: logo, type: image, options: { media: uploads } }
      - { name: problemBullets, type: string, list: true }
      - { name: solutionBullets, type: string, list: true }
      - name: homeCopy
        label: Homepage section headings and labels
        type: object
        fields:
          - { name: pricingEyebrow, type: string }
          - { name: pricingTitle, type: string }
          - { name: pricingLead, type: text }
          - { name: offerLabel, type: string }
          - { name: offerText, type: string }
          - { name: whyEyebrow, type: string }
          - { name: whyTitle, type: string }
          - { name: whyDescription, type: text }
          - { name: problemTitle, type: string }
          - { name: solutionTitle, type: string }
          - { name: toolsEyebrow, type: string }
          - { name: toolsTitle, type: string }
          - { name: toolsDescription, type: text }
          - { name: toolBadge, type: string }
          - { name: comparisonTitle, type: string }
          - { name: comparisonHint, type: text }
          - { name: extensionEyebrow, type: string }
          - { name: extensionTitle, type: string }
          - { name: extensionDescription, type: text }
          - { name: limitationsEyebrow, type: string }
          - { name: limitationsTitle, type: string }
          - { name: limitationsDescription, type: text }
          - { name: reviewsEyebrow, type: string }
          - { name: reviewsTitle, type: string }
          - { name: reviewsCount, type: string }
          - { name: faqTitle, type: string }
          - { name: faqLead, type: text }
          - { name: guidesTitle, type: string }
          - { name: guidesLabel, type: string }
      - name: extensionFeatures
        label: Toolbar feature descriptions
        type: object
        list: true
        fields:
          - { name: title, type: string }
          - { name: description, type: text }
      - name: featureDescriptions
        label: Pricing feature descriptions
        type: object
        list: true
        fields:
          - { name: name, type: string }
          - { name: description, type: text }
  - name: privacy
    label: Privacy Policy
    type: file
    path: content/privacy.json
    format: json
    fields:
      - { name: seoTitle, type: string }
      - { name: seoDescription, type: text }
      - { name: html, type: rich-text, options: { format: html, media: uploads, switcher: false } }