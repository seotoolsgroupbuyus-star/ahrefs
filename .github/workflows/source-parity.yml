name: Check original ZIP word-by-word parity
on:
  workflow_dispatch:
jobs:
  compare-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run verify:source-parity
      - run: node scripts/verify-original-page-seo.mjs
      - run: node scripts/verify-literal-copy.mjs
      - run: node scripts/verify-home-content-parity.mjs
