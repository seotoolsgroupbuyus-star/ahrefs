name: Verify Astro and Pages CMS migration
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run verify
      - run: npm run verify:source-parity
      - run: node scripts/verify-original-page-seo.mjs
      - run: node scripts/verify-literal-copy.mjs
      - run: npm run verify:cms
      - run: npm run test:cms-edit
      - run: node scripts/verify-home-content-parity.mjs
      - run: npm run build
      - run: node scripts/verify-built-pages.mjs
